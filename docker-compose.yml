version: '3.8'

services:
  queue-producer:
    build:
      context: .
    ports:
      - "7888:7888"
    environment:
      # Core settings
      HTTP_SERVER_PORT: 7888
      HTTP_SERVER_HOST: 0.0.0.0
      CONTENT_SERVER_URLS: https://peer.decentraland.org/content

      # Worlds sync settings (new)
      WORLDS_CONTENT_SERVER_URL: https://worlds-content-server.decentraland.org
      WORLDS_SYNC_INTERVAL_MS: 60000  # 1 minute for testing (default is 600000 = 10 min)

      # AWS settings - uncomment and set for real testing
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_REGION: us-east-1
      # SCENE_SNS_ARN: ${SCENE_SNS_ARN}
    volumes:
      - ./content:/app/content
    restart: "no"